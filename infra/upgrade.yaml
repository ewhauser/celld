# Binary-upgrade overlay, layered after infra/operations.yaml.
#
# infra/compose.yaml pins one celld image for the whole fleet. This overlay
# indirects each node's image through its own variable so one run can start a
# fleet on an explicitly pinned older release and then replace one node at a
# time with the pinned current release, which is what a rolling binary upgrade
# is. The `tool` service is not indirected: the deployment is written once, by
# the release the rest of the suite pins.
#
# All defaults are the pinned v0.6.0 digest, so selecting this overlay without
# setting the variables changes nothing.
#
# The upgrade scenario keeps the 40-second total stop bound previously used
# for rolling upgrades. Both pinned releases accept this control.
services:
  celld:
    image: "${TCK_IMAGE_CELLD:-ghcr.io/denoland/celld:v0.6.0@sha256:e188a7f2bb0b8cec9fb04ee4c3d1ed7cca0ea0419519ae2a9ba36e5b6fe5161b}"
    environment:
      CELLD_SHUTDOWN_TOTAL_MS: "40000"
  celld2:
    image: "${TCK_IMAGE_CELLD2:-ghcr.io/denoland/celld:v0.6.0@sha256:e188a7f2bb0b8cec9fb04ee4c3d1ed7cca0ea0419519ae2a9ba36e5b6fe5161b}"
    environment:
      CELLD_SHUTDOWN_TOTAL_MS: "40000"
  celld3:
    image: "${TCK_IMAGE_CELLD3:-ghcr.io/denoland/celld:v0.6.0@sha256:e188a7f2bb0b8cec9fb04ee4c3d1ed7cca0ea0419519ae2a9ba36e5b6fe5161b}"
    environment:
      CELLD_SHUTDOWN_TOTAL_MS: "40000"
