services:
  executor:
    build: ..
    init: true
    restart: unless-stopped
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
    stop_grace_period: 10s
    tmpfs: ["/tmp:size=64m,mode=1777"]
    volumes:
      - ./config.json:/etc/celld-sandbox/config.json:ro
      - ../tools:/tools:ro
    environment:
      CELLD_SANDBOX_CONFIG: /etc/celld-sandbox/config.json
      CELLD_SANDBOX_TOKEN: ${CELLD_SANDBOX_TOKEN:?set a random supervisor token}
      CELLD_SANDBOX_CALLBACK_TOKEN: ${CELLD_SANDBOX_CALLBACK_TOKEN:?set a distinct random callback token}
    ports: ["127.0.0.1:19877:19877"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:19877/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
