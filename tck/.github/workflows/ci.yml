name: Compatibility
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: checks
            command: pnpm check
          - name: reference
            command: pnpm test:reference
          - name: local
            command: pnpm test:local
          - name: recovery
            command: pnpm test:recovery
          - name: multinode
            command: pnpm test:multinode
          - name: fleet
            command: pnpm test:fleet
          - name: resilience
            command: pnpm test:resilience
          - name: traffic
            command: pnpm test:traffic
          - name: dependencies
            command: pnpm test:dependencies
          - name: faults
            command: pnpm test:faults
          - name: capacity
            command: pnpm test:capacity
          - name: security
            command: pnpm test:security
          - name: telemetry
            command: pnpm test:telemetry
          - name: operations
            command: pnpm test:operations
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: ${{ matrix.command }}
      - name: Collect dashboard evidence
        if: always()
        env:
          SUITE: ${{ matrix.name }}
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p site-input
          node -e 'const fs = require("node:fs"); const e = process.env; fs.writeFileSync("site-input/job.json", JSON.stringify({suite:e.SUITE, conclusion:e.JOB_STATUS, sha:e.GITHUB_SHA, runId:e.GITHUB_RUN_ID, attempt:e.GITHUB_RUN_ATTEMPT}))'
          for report in artifacts/*/report.json; do
            [ -f "$report" ] || continue
            destination="site-input/$(basename "$(dirname "$report")")"
            mkdir -p "$destination"
            cp "$report" "$destination/report.json"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: compatibility-summary-${{ matrix.name }}
          path: site-input/
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: compatibility-evidence-${{ matrix.name }}
          path: artifacts/
          retention-days: 7

  site:
    needs: compatibility
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true # Missing evidence must appear on the dashboard.
        with:
          pattern: compatibility-summary-*
          path: .cache/site-input
      - run: pnpm site:build
        env:
          CI_RESULT: ${{ needs.compatibility.result }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compatibility-site
          path: .cache/site/
          retention-days: 7
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: .cache/site

  deploy:
    needs: site
    if: ${{ !cancelled() && needs.site.result == 'success' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
