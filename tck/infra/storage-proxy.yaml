# Fresh upstream connections avoid MinIO conditional-write keep-alive resets.
# Used for setup diagnostics; qualification also routes runtime storage here.
services:
  proxy:
    image: node:24-alpine@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1
    command: [node, /fixture/proxy.mjs]
    environment:
      TCK_PROXY_CHILD: "1"
    volumes:
      - type: bind
        source: ${TCK_FIXTURE_DIR:?}
        target: /fixture
        read_only: true
    ports: ["127.0.0.1::9091"]
