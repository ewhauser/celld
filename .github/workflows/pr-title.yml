name: PR title

# Squash merges use the PR title as the commit subject, and release-please
# reads only Conventional Commit subjects. A title it cannot parse drops the
# change from the changelog and never starts a release.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  conventional:
    name: Conventional title
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Check the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          types='feat|fix|perf|revert|docs|test|build|ci|chore|refactor|style'
          if [[ "$TITLE" =~ ^($types)(\([a-z0-9._/-]+\))?!: ]]; then
            echo "::error::'$TITLE' marks a breaking change. release-please would then jump from 0.6.2-ewhauser.N to the next minor version. Describe the break in the PR body instead; the release still advances -ewhauser.N."
            exit 1
          fi
          if [[ ! "$TITLE" =~ ^($types)(\([a-z0-9._/-]+\))?:\ [^[:space:]] ]]; then
            echo "::error::'$TITLE' is not a Conventional Commit title. Use 'type: summary' or 'type(scope): summary' with one of: ${types//|/, }. Only fix, feat, perf and revert start a release."
            exit 1
          fi
