name: TCK

# Gates pull requests on the TCK in tck/: its static checks and reference
# run, and its compatibility and recovery suites run against this change's
# own image instead of the upstream release the TCK pins. The image is
# built once and handed to one job per suite. `TCK passed` is the single
# check to require in branch protection.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tck-${{ github.ref }}
  cancel-in-progress: true

env:
  TCK_CELLD_IMAGE: celld:tck

jobs:
  # Format, lint, typecheck and unit tests, then two independent workerd
  # instances against each other. Neither needs the celld image.
  checks:
    name: TCK ${{ matrix.name }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: checks
            command: pnpm check
          - name: reference
            command: pnpm test:reference
    defaults:
      run:
        working-directory: tck
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: tck/package.json

      - uses: actions/setup-node@v6
        with:
          node-version-file: tck/.node-version
          cache: pnpm
          cache-dependency-path: tck/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Run
        env:
          COMMAND: ${{ matrix.command }}
        run: $COMMAND

      # The per-suite reports the dashboard job below builds from.
      - name: Collect dashboard evidence
        if: always()
        env:
          SUITE: ${{ matrix.name }}
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p site-input
          node -e 'const fs = require("node:fs"); const e = process.env; fs.writeFileSync("site-input/job.json", JSON.stringify({suite:e.SUITE, conclusion:e.JOB_STATUS, sha:e.GITHUB_SHA, runId:e.GITHUB_RUN_ID, attempt:e.GITHUB_RUN_ATTEMPT}))'
          for report in artifacts/*/report.json; do
            [ -f "$report" ] || continue
            destination="site-input/$(basename "$(dirname "$report")")"
            mkdir -p "$destination"
            cp "$report" "$destination/report.json"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compatibility-summary-${{ matrix.name }}
          path: tck/site-input/
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tck-evidence-${{ matrix.name }}
          path: tck/artifacts/
          if-no-files-found: ignore
          retention-days: 7

  image:
    name: Build candidate image
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      # The runner's preinstalled SDKs leave too little disk for the cargo
      # target cache below to be restored, used by BuildKit and extracted
      # again.
      - name: Free disk space
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: docker/setup-buildx-action@v3

      # `docker buildx build` in a run step only reaches the gha layer cache
      # when the Actions cache runtime is in its environment.
      - uses: crazy-max/ghaction-github-runtime@v3

      # The Dockerfile's cargo registry, git and target cache mounts live in
      # the builder, which is new each run, so on their own they start empty
      # and every build compiles all ~350 crates. Carry them across runs in
      # the Actions cache instead. As in CI, only pushes to main (and manual
      # runs) save: a pull request can restore main's entry but not another
      # pull request's. A lockfile or toolchain change starts a fresh entry,
      # which keeps stale dependency builds from piling up in it.
      - name: Cache key
        id: cache-key
        run: |
          set -euo pipefail
          rust=$(sed -n 's/^ARG RUST_VERSION=//p' Dockerfile)
          echo "prefix=tck-cargo-mounts-v1-rust-$rust-${{ hashFiles('Cargo.lock') }}-" >> "$GITHUB_OUTPUT"

      - name: Restore cargo cache mounts
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/cargo-mounts
          key: ${{ steps.cache-key.outputs.prefix }}${{ github.run_id }}
          restore-keys: ${{ steps.cache-key.outputs.prefix }}

      # Declared before the cache dance so that its post step, which saves,
      # runs after the dance's post step has extracted the mounts.
      - name: Restore and save cargo cache mounts
        if: github.event_name != 'pull_request'
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/cargo-mounts
          key: ${{ steps.cache-key.outputs.prefix }}${{ github.run_id }}
          restore-keys: ${{ steps.cache-key.outputs.prefix }}

      - name: Inject cargo cache mounts
        uses: reproducible-containers/buildkit-cache-dance@v3.4.0
        with:
          cache-map: |
            {
              "${{ runner.temp }}/cargo-mounts/registry": {"id": "celld-cargo-registry", "target": "/usr/local/cargo/registry"},
              "${{ runner.temp }}/cargo-mounts/git": {"id": "celld-cargo-git", "target": "/usr/local/cargo/git"},
              "${{ runner.temp }}/cargo-mounts/target": {"id": "celld-target-amd64", "target": "/src/target"}
            }
          scratch-dir: ${{ runner.temp }}/cache-dance-scratch
          skip-extraction: ${{ github.event_name == 'pull_request' }}

      # `lab` is `release` without the fat-LTO relink: the same code at a
      # fraction of the build time. The image skips the Dockerfile's test
      # stage: CI's Lint and test job already runs the workspace tests and
      # clippy on every change.
      - name: Build
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/celld/Cargo.toml | head -1)
          docker buildx build \
            --platform linux/amd64 \
            --build-arg CELLD_PROFILE=lab \
            --build-arg CELLD_BINARY_FROM=build \
            --build-arg "CELLD_COMMIT=$GITHUB_SHA" \
            --build-arg "CELLD_VERSION=$version" \
            --cache-from type=gha,scope=tck-image \
            --cache-to type=gha,scope=tck-image,mode=max \
            --load \
            --tag "$TCK_CELLD_IMAGE" \
            .
          docker run --rm "$TCK_CELLD_IMAGE" --version | grep -F "$version"
          mkdir -p out
          docker save "$TCK_CELLD_IMAGE" | gzip -1 > out/celld-tck-image.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: celld-tck-image
          path: out/celld-tck-image.tar.gz
          if-no-files-found: error
          retention-days: 3

  suite:
    name: TCK ${{ matrix.suite }}
    needs: image
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # Pull requests run the core suites. Pushes to main and manual runs
      # add the slower resilience, qualification and operations suites.
      matrix:
        suite: ${{ fromJSON(github.event_name == 'pull_request' && '["local","recovery","multinode","fleet"]' || '["local","recovery","multinode","fleet","resilience","traffic","dependencies","faults","capacity","security","telemetry","operations"]') }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          name: celld-tck-image

      - name: Load candidate image
        run: gunzip -c celld-tck-image.tar.gz | docker load

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: tck/package.json

      - uses: actions/setup-node@v6
        with:
          node-version-file: tck/.node-version
          cache: pnpm
          cache-dependency-path: tck/pnpm-lock.yaml

      - name: Install
        working-directory: tck
        run: pnpm install --frozen-lockfile

      - name: Run
        working-directory: tck
        env:
          SUITE: ${{ matrix.suite }}
        run: pnpm "test:$SUITE"

      # The per-suite reports the dashboard job below builds from.
      - name: Collect dashboard evidence
        if: always()
        env:
          SUITE: ${{ matrix.suite }}
          JOB_STATUS: ${{ job.status }}
        working-directory: tck
        run: |
          mkdir -p site-input
          node -e 'const fs = require("node:fs"); const e = process.env; fs.writeFileSync("site-input/job.json", JSON.stringify({suite:e.SUITE, conclusion:e.JOB_STATUS, sha:e.GITHUB_SHA, runId:e.GITHUB_RUN_ID, attempt:e.GITHUB_RUN_ATTEMPT}))'
          for report in artifacts/*/report.json; do
            [ -f "$report" ] || continue
            destination="site-input/$(basename "$(dirname "$report")")"
            mkdir -p "$destination"
            cp "$report" "$destination/report.json"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compatibility-summary-${{ matrix.suite }}
          path: tck/site-input/
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tck-evidence-${{ matrix.suite }}
          path: tck/artifacts/
          if-no-files-found: ignore
          retention-days: 7

  # The results dashboard, built from this run's reports by the TCK source
  # at this commit. The docs site (site.yaml) publishes the one from the
  # latest finished run on main at /compatibility/. Pull requests skip it:
  # they run only some suites, so most of the matrix would read as missing.
  dashboard:
    name: TCK dashboard
    needs: [checks, suite]
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tck
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: tck/package.json

      - uses: actions/setup-node@v6
        with:
          node-version-file: tck/.node-version
          cache: pnpm
          cache-dependency-path: tck/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        continue-on-error: true # Missing evidence must appear on the dashboard.
        with:
          pattern: compatibility-summary-*
          path: tck/.cache/site-input

      - name: Build
        env:
          CI_RESULT: ${{ needs.checks.result == 'success' && needs.suite.result == 'success' && 'success' || 'failure' }}
        run: pnpm site:build --docs-url ../

      - uses: actions/upload-artifact@v4
        with:
          name: compatibility-site
          path: tck/.cache/site/
          include-hidden-files: true
          retention-days: 90

  # One stable check name for branch protection, whatever the matrix holds.
  gate:
    name: TCK passed
    needs: [checks, suite]
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Require every job
        env:
          CHECKS: ${{ needs.checks.result }}
          SUITES: ${{ needs.suite.result }}
        run: |
          echo "checks: $CHECKS, suites: $SUITES"
          test "$CHECKS" = success
          test "$SUITES" = success
