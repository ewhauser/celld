name: Site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Republish the compatibility and performance results when a TCK or
  # Performance run on main finishes.
  workflow_run:
    workflows: [TCK, Performance]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: site-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: site-build
    permissions:
      contents: read
      actions: read # Download the TCK dashboard and the Performance results.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          package_json_file: site/package.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: site/.node-version
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      # The TCK workflow builds the results dashboard on main. Publish the
      # one from the latest run that finished rather than being cancelled.
      # Without one, pnpm sync leaves a placeholder page.
      - name: Fetch the compatibility results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/tck.yml/runs?branch=main&status=completed&per_page=50" \
            | jq -r --arg repo "$GITHUB_REPOSITORY" '[.workflow_runs[]
                | select(.event == "push" or .event == "workflow_dispatch")
                | select(.conclusion == "success" or .conclusion == "failure")
                | select(.head_repository.full_name == $repo)
                | .id][:5][]')
          for run in $runs; do
            if gh run download "$run" --repo "$GITHUB_REPOSITORY" --name compatibility-site --dir public/compatibility; then
              echo "Compatibility results from TCK run $run"
              exit 0
            fi
            rm -rf public/compatibility
          done
          echo "::warning::No recent TCK run on main has a results dashboard; publishing a placeholder."
      # The Performance workflow runs the scenarios nightly on main. Publish
      # the results of the latest run that finished rather than being
      # cancelled. Without any, the performance page says so.
      - name: Fetch the performance results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/perf.yml/runs?branch=main&status=completed&per_page=50" \
            | jq -c --arg repo "$GITHUB_REPOSITORY" '[.workflow_runs[]
                | select(.event == "schedule" or .event == "workflow_dispatch")
                | select(.conclusion == "success" or .conclusion == "failure")
                | select(.head_repository.full_name == $repo)
                | {id, url: .html_url, event, conclusion, head_sha, created_at}][:5][]' \
            > "$RUNNER_TEMP/perf-runs"
          while read -r run; do
            id=$(jq -r .id <<<"$run")
            if gh run download "$id" --repo "$GITHUB_REPOSITORY" --name perf-results --dir perf-results; then
              jq . <<<"$run" > perf-results/run.json
              echo "Performance results from run $id"
              exit 0
            fi
            rm -rf perf-results
          done < "$RUNNER_TEMP/perf-runs"
          echo "::warning::No recent Performance run on main has results; the page says none are published."
      # Generate only fork references; fail on broken internal links.
      - run: pnpm build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site
          path: site/dist/
          retention-days: 7
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: site/dist

  deploy:
    name: site-deploy
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write # Deploy the validated documentation artifact.
      id-token: write # Authenticate the Pages deployment with OIDC.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
